[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
addopts = -v --tb=short --strict-markers
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: marks tests as unit tests (fast, isolated)
    integration: marks tests as integration tests (database, API)
    agent: marks tests as agent tests (AI agent logic)
    e2e: marks tests as end-to-end tests (full flow)
    performance: marks tests as performance tests (benchmarks)
    security: marks tests as security tests (auth, validation)
    slow: marks tests as slow (deselect with '-m "not slow"')
