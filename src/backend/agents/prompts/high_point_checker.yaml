deep_analysis_prompt: "请深度分析以下章节的高潮点设置和兴奋点密度。\n\n【章节内容】\n{content}\n\n【类型/风格】\n{genre}\n\
  \n【前文摘要】\n{prev_text}\n\n请从以下维度分析：\n1. **高潮点数量**：本章是否有足够的高潮/兴奋点\n2. **高潮点位置**：高潮点分布是否合理（应有前中后分布，结尾应有钩子）\n\
  3. **高潮强度**：每个高潮点的冲击力是否足够\n4. **铺垫质量**：高潮前的铺垫是否充分，是否有伏笔呼应\n5. **情绪曲线**：整体情绪曲线是否有起伏，是否有张弛\n\
  6. **结尾钩子**：章节结尾是否有足够的悬念或认知差\n\n请以JSON格式返回：\n{{\n    \"score\": 0-100的评分,\n    \"\
  issues\": [\n        {{\n            \"type\": \"问题类型\",\n            \"severity\"\
  : \"critical|high|medium|low\",\n            \"message\": \"问题描述\",\n          \
  \  \"evidence\": \"正文中的证据片段\"\n        }}\n    ],\n    \"suggestions\": [\"改进建议列表\"\
  ]\n}}"
deep_analysis_system_prompt: 你是一位专业的叙事高潮分析专家。你的任务是评估小说章节的高潮设置是否合理。好的章节应该有2-3个不同强度的高潮点，结尾应有悬念钩子。评分标准：100=高潮完美，80=高潮良好，60=高潮一般，40=高潮不足，20=缺乏高潮，0=完全平淡。
