deep_analysis_prompt: "请深度分析以下章节的叙事连续性问题。\n\n【章节内容】\n{content}\n\n【前文摘要】\n{prev_text}\n\
  \n【活跃的伏笔/情节线】\n{threads_text}\n\n【角色设定】\n{chars_text}\n\n【世界观设定】\n{world_text}\n\
  \n请从以下维度分析连续性：\n1. **场景转换连续性**：场景转换是否平滑（时间流逝、地点跳转是否有合理过渡）\n2. **角色状态连续性**：角色的情绪、服装、伤势、位置等状态是否与前文延续\n\
  3. **事件因果连续性**：事件之间的因果关系是否合理（前因后果是否矛盾）\n4. **伏笔呼应连续性**：之前埋下的伏笔是否得到适当揭示或延续\n5. **细节一致性**：前后描述的细节是否一致（如物品外观、人物外貌等）\n\
  6. **时间逻辑连续性**：时间流逝是否合理（对话时长、旅途时间、修炼时间等）\n\n请以JSON格式返回：\n{{\n    \"score\": 0-100的评分,\n\
  \    \"issues\": [\n        {{\n            \"type\": \"问题类型\",\n            \"\
  severity\": \"critical|high|medium|low\",\n            \"message\": \"问题描述\",\n\
  \            \"evidence\": \"正文中的证据片段\",\n            \"previous_context\": \"与前文矛盾的具体描述\"\
  \n        }}\n    ],\n    \"suggestions\": [\"改进建议列表\"],\n    \"plot_thread_status\"\
  : {{\n        \"fulfilled\": [\"已完成的伏笔列表\"],\n        \"continued\": [\"延续中的伏笔列表\"\
  ],\n        \"new_setup\": [\"本章新埋下的伏笔列表\"]\n    }}\n}}"
deep_analysis_system_prompt: 你是一位严格的叙事连续性审核专家。你的任务是确保正文内容与前文完全连贯，任何场景转换突兀、状态不一致、因果矛盾、伏笔未呼应等问题都应被标记。评分标准：100=完全连贯，80=轻微不连贯，60=明显不连贯，40=严重不连贯，20=重大矛盾，0=完全断裂。
legacy_check_prompt: "审查以下章节的连续性问题：\n\n当前章节内容：\n{content}\n\n前几章摘要：\n{previous_contents}\n\
  \n活跃的伏笔/情节线：\n{plot_threads_json}\n\n请检查以下连续性问题：\n1. 场景转换是否突兀（时间、地点跳转是否平滑）\n2. 前后事件是否矛盾（之前发生的事与之后描述是否一致）\n\
  3. 角色状态是否连贯（情绪、服装、伤势等是否延续）\n4. 伏笔是否得到呼应（之前埋下的伏笔是否被适当揭示或延续）\n5. 细节是否自相矛盾（如前面说A死了，后面又写A活着）\n\
  \n请以JSON格式返回：\n{{\n    \"issues\": [\"连续性问题列表\"],\n    \"suggestions\": [\"改进建议\"\
  ],\n    \"score\": 1-100的评分,\n    \"plot_thread_status\": {{\n        \"fulfilled\"\
  : [\"已完成的伏笔列表\"],\n        \"continued\": [\"延续中的伏笔列表\"],\n        \"new_setup\"\
  : [\"本章新埋下的伏笔列表\"]\n    }}\n}}"
legacy_check_system_prompt: 你是一位专业的叙事连续性审核专家。仔细检查章节与前后章节之间的连贯性，识别场景转换突兀、事件矛盾、角色状态不一致、伏笔未呼应等问题。
