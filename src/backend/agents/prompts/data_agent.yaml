extract_entities_prompt: "你是一位专业的小说文本分析专家。从以下小说章节文本中提取所有实体信息。\n\n【重要】你必须返回一个有效的JSON数组，不要包含任何其他文字说明。\n\
  JSON格式要求：\n- 使用双引号包裹所有字符串\n- 字段名必须使用双引号\n- 不要使用单引号或无引号的字段名\n- 数组格式：[]\n\n每个实体对象必须包含以下字段：\n\
  - name: 实体名称（字符串，必填）\n- type: 实体类型（字符串，必填），可选值：character/location/item/faction/concept\n\
  - description: 实体描述或特征（字符串，可为空）\n\n示例返回格式：\n[\n    {{\"name\": \"张三\", \"type\"\
  : \"character\", \"description\": \"主角，剑客\"}},\n    {{\"name\": \"青云山\", \"type\"\
  : \"location\", \"description\": \"修仙门派所在地\"}},\n    {{\"name\": \"玄天剑\", \"type\"\
  : \"item\", \"description\": \"上古神兵\"}}\n]\n\n只返回确定的实体，不要臆造信息。"
extract_relationships_prompt: "你是一位专业的小说文本分析专家。分析以下小说章节文本，提取实体之间的关系。\n\n【重要】你必须返回一个有效的JSON数组，不要包含任何其他文字说明。\n\
  JSON格式要求：\n- 使用双引号包裹所有字符串\n- 字段名必须使用双引号\n\n每个关系对象必须包含以下字段：\n- source: 源实体名称（字符串，必填）\n\
  - target: 目标实体名称（字符串，必填）\n- type: 关系类型（字符串，必填），可选值：enemy/ally/family/love/rival/dominates/owns/related等\n\
  - description: 关系描述（字符串，可为空）\n\n示例返回格式：\n[\n    {{\"source\": \"张三\", \"target\"\
  : \"李四\", \"type\": \"enemy\", \"description\": \"世仇\"}},\n    {{\"source\": \"\
  张三\", \"target\": \"王五\", \"type\": \"ally\", \"description\": \"结拜兄弟\"}}\n]"
generate_summary_prompt: '你是一位专业的小说文本分析专家。为以下小说章节生成简洁的摘要。


  【重要】直接返回摘要文本，不要包含任何JSON格式或其他格式标记。

  摘要要求：

  - 200字以内

  - 包含本章主要事件

  - 包含关键转折点

  - 包含对后续剧情的铺垫


  直接输出摘要文本，不要用引号包裹，不要用JSON格式。'
slice_scenes_prompt: "你是一位专业的小说文本分析专家。将以下小说章节分割成场景。\n\n【重要】你必须返回一个有效的JSON数组，不要包含任何其他文字说明。\n\
  JSON格式要求：\n- 使用双引号包裹所有字符串\n- 字段名必须使用双引号\n\n每个场景对象必须包含以下字段：\n- scene_number: 场景序号（数字，必填）\n\
  - location: 场景地点（字符串，必填）\n- characters: 出场角色列表（字符串数组，必填）\n- key_events: 关键事件列表（字符串数组，必填）\n\
  - mood: 场景基调/氛围（字符串，可为空）\n\n示例返回格式：\n[\n    {{\"scene_number\": 1, \"location\"\
  : \"青云山巅\", \"characters\": [\"张三\", \"师父\"], \"key_events\": [\"张三拜师\", \"传授剑法\"\
  ], \"mood\": \"肃穆\"}},\n    {{\"scene_number\": 2, \"location\": \"山脚小镇\", \"characters\"\
  : [\"张三\", \"小贩\"], \"key_events\": [\"购买药材\", \"遇到埋伏\"], \"mood\": \"紧张\"}}\n]"
track_state_changes_prompt: "你是一位专业的小说文本分析专家。分析以下小说章节文本，提取实体状态变化。\n\n【重要】你必须返回一个有效的JSON数组，不要包含任何其他文字说明。\n\
  JSON格式要求：\n- 使用双引号包裹所有字符串\n- 字段名必须使用双引号\n\n每个状态变化对象必须包含以下字段：\n- entity: 实体名称（字符串，必填）\n\
  - before_state: 变化前状态（字符串，必填）\n- after_state: 变化后状态（字符串，必填）\n- trigger: 触发原因（字符串，必填）\n\
  \n示例返回格式：\n[\n    {{\"entity\": \"张三\", \"before_state\": \"重伤\", \"after_state\"\
  : \"痊愈\", \"trigger\": \"服用九转还魂丹\"}},\n    {{\"entity\": \"玄天剑\", \"before_state\"\
  : \"封印中\", \"after_state\": \"已解封\", \"trigger\": \"主人滴血认主\"}}\n]"
