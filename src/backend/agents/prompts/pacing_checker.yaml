deep_analysis_prompt: "请深度分析以下章节的叙事节奏和故事线比例。\n\n【章节内容】\n{content}\n\n【类型/风格】\n{genre}\n\
  \n【前文摘要】\n{prev_text}\n\n故事线理想比例：\n- 任务线（Quest）: 60% — 主线任务推进、修炼突破、冒险挑战\n- 燃情线（Fire）:\
  \ 20% — 感情戏、人际关系、情感发展\n- 星座线（Constellation）: 20% — 宿命、伏笔、世界观揭示\n\n请从以下维度分析：\n1.\
  \ **故事线比例**：三种故事线的实际比例是否接近理想值\n2. **节奏张弛**：紧张与舒缓交替是否合理，是否有节奏单调的问题\n3. **信息密度**：每段落的信息量是否适中，是否有信息过载或过稀\n\
  4. **场景转换**：场景切换是否自然流畅\n5. **章节结尾**：结尾是否有足够的悬念或钩子引导读者继续阅读\n6. **阅读体验**：整体阅读节奏是否流畅，是否有拖沓或仓促感\n\
  \n请以JSON格式返回：\n{{\n    \"score\": 0-100的评分,\n    \"strand_ratios\": {{\n       \
  \ \"quest\": 实际比例,\n        \"fire\": 实际比例,\n        \"constellation\": 实际比例\n \
  \   }},\n    \"issues\": [\n        {{\n            \"type\": \"问题类型\",\n      \
  \      \"severity\": \"critical|high|medium|low\",\n            \"message\": \"\
  问题描述\",\n            \"evidence\": \"正文中的证据片段\"\n        }}\n    ],\n    \"suggestions\"\
  : [\"改进建议列表\"]\n}}"
deep_analysis_system_prompt: 你是一位专业的叙事节奏分析专家。你的任务是评估小说章节的节奏感和故事线比例。理想的任务线/燃情线/星座线比例为60%/20%/20%。评分标准：100=节奏完美，80=节奏良好，60=节奏一般，40=节奏较差，20=节奏失衡，0=完全无节奏感。
