deep_analysis_prompt: "请深度分析以下章节内容是否违反了世界观的物理规则和逻辑一致性。\n\n【章节内容】\n{content}\n\n【世界观设定】\n\
  {world_text}\n\n【世界规则】\n{rules_text}\n\n【力量体系】\n{power_text}\n\n【角色当前状态】\n{chars_text}\n\
  \n【前文摘要】\n{prev_text}\n\n请从以下维度分析：\n1. **力量体系一致性**：角色使用的力量/技能是否与其当前境界/等级匹配\n2. **规则约束遵守**：世界规则（如魔法限制、天道法则、物理定律）是否被无解释地打破\n\
  3. **因果逻辑**：事件因果关系是否合理（如付出与收获是否匹配，代价与收益是否平衡）\n4. **资源守恒**：能量、资源、物品的消耗与获取是否符合守恒原则\n\
  5. **空间/时间逻辑**：场景转换、时间流逝、距离移动是否符合物理逻辑\n6. **群体行为逻辑**：群体反应、势力行为是否符合其设定立场和利益\n\n请以JSON格式返回：\n\
  {{\n    \"score\": 0-100的评分,\n    \"issues\": [\n        {{\n            \"type\"\
  : \"问题类型\",\n            \"severity\": \"critical|high|medium|low\",\n         \
  \   \"message\": \"问题描述\",\n            \"evidence\": \"正文中的证据片段\",\n          \
  \  \"rule_violated\": \"违反的具体规则\"\n        }}\n    ],\n    \"suggestions\": [\"\
  改进建议列表\"]\n}}"
deep_analysis_system_prompt: 你是一位严格的世界观物理执法官。你的任务是确保正文内容完全符合已建立的世界规则、力量体系和物理逻辑。任何无合理解释的破格行为都应被标记。评分标准：100=完全合规，80=轻微偏离，60=明显偏离，40=严重偏离，20=重大违规，0=完全崩坏。
