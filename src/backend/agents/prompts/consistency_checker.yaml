deep_analysis_prompt: "请深度分析以下章节内容的世界观一致性问题。\n\n【章节内容】\n{content}\n\n【世界观设定】\n{world_text}\n\
  \n【角色设定】\n{chars_text}\n\n【地点设定】\n{locs_text}\n\n【前文摘要】\n{prev_text}\n\n请从以下维度分析一致性：\n\
  1. **地点一致性**：正文中的地点描述是否与已设定的地点特征一致\n2. **时间线一致性**：事件发生的先后顺序是否合理，时间流逝是否矛盾\n3. **力量等级一致性**：角色实力是否与之前描述的等级相符\n\
  4. **物品归属一致性**：重要物品的位置和归属是否与之前描述一致\n5. **势力关系一致性**：势力间的敌友关系、领地描述是否一致\n6. **角色状态一致性**：角色的情绪、服装、伤势等状态是否延续\n\
  \n请以JSON格式返回：\n{{\n    \"score\": 0-100的评分,\n    \"issues\": [\n        {{\n   \
  \         \"type\": \"问题类型\",\n            \"severity\": \"critical|high|medium|low\"\
  ,\n            \"message\": \"问题描述\",\n            \"evidence\": \"正文中的证据片段\"\n\
  \        }}\n    ],\n    \"suggestions\": [\"改进建议列表\"]\n}}"
deep_analysis_system_prompt: 你是一位严格的世界观一致性审核专家。你的任务是确保正文内容与已建立的世界设定完全一致。任何细微的矛盾都应被标记。评分标准：100=完全一致，80=轻微不一致，60=明显不一致，40=严重不一致，20=重大矛盾，0=完全崩坏。
legacy_check_prompt: "审查以下章节内容，检查世界观一致性：\n\n章节内容：\n{content}\n\n世界观设定：\n{world_context}\n\
  \n请检查以下方面的一致性：\n1. 地点描述是否与已设定的地点一致\n2. 时间线是否连贯（事件顺序是否合理）\n3. 角色实力/修为等级是否与之前描述一致\n\
  4. 物品归属和位置是否正确\n5. 势力关系和立场是否一致\n\n请以JSON格式返回：\n{{\n    \"issues\": [\"具体问题描述列表\"\
  ],\n    \"suggestions\": [\"改进建议列表\"],\n    \"score\": 1-100的评分\n}}"
legacy_check_system_prompt: 你是一位专业的小说设定审核专家。仔细审查章节内容与世界观设定之间的一致性，检查地点、时间线、实力等级、物品归属、势力关系等方面的逻辑矛盾。
