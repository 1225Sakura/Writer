deep_analysis_prompt: "请深度分析以下章节的读者吸引力和钩子效果。\n\n【章节内容】\n{content}\n\n【类型/风格】\n{genre}\n\
  \n【前文摘要】\n{prev_text}\n\n【下章预览】\n{next_chapter_preview}\n\n请从以下维度分析读者吸引力：\n1. **开篇钩子**：开头是否能立即抓住读者注意力（前200字）\n\
  2. **悬念设置**：章节中是否有足够的悬念和谜团\n3. **认知差**：是否有读者知道但角色不知道的信息（或反之）\n4. **冲突张力**：是否有足够的对抗和矛盾推动阅读\n\
  5. **情感共鸣**：是否能引发读者的情感投入\n6. **结尾钩子**：结尾是否有足够的悬念让读者想看下一章\n7. **信息释放节奏**：是否适时揭示信息保持好奇心\n\
  \n请以JSON格式返回：\n{{\n    \"score\": 0-100的评分,\n    \"issues\": [\n        {{\n   \
  \         \"type\": \"问题类型\",\n            \"severity\": \"critical|high|medium|low\"\
  ,\n            \"message\": \"问题描述\",\n            \"evidence\": \"正文中的证据片段\"\n\
  \        }}\n    ],\n    \"suggestions\": [\"改进建议列表\"]\n}}"
deep_analysis_system_prompt: 你是一位专业的网文读者体验分析专家。你的任务是评估小说章节是否能有效吸引读者继续阅读。好的章节应该有清晰的钩子、足够的悬念、恰当的认知差和情感共鸣。评分标准：100=极具吸引力，80=吸引力良好，60=吸引力一般，40=吸引力较差，20=难以吸引读者，0=完全无法吸引读者。
