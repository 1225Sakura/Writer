deep_analysis_prompt: "请深度分析以下章节内容中的角色行为一致性问题（OOC检测）。\n\n【章节内容】\n{content}\n\n【角色设定】\n\
  {chars_text}\n\n请从以下维度分析角色行为一致性：\n1. **性格一致性**：角色行为是否符合其性格设定（如内向角色不应突然变得健谈）\n2.\
  \ **动机一致性**：角色行动是否符合其动机和目标\n3. **情感一致性**：角色情绪反应是否合理，是否有突兀的情绪转变\n4. **语言风格一致性**：角色说话方式是否符合其身份和性格\n\
  5. **关系一致性**：角色间互动是否符合已建立的关系\n6. **能力一致性**：角色展现的能力是否符合设定的等级\n\n请以JSON格式返回：\n{{\n\
  \    \"score\": 0-100的评分,\n    \"issues\": [\n        {{\n            \"type\":\
  \ \"问题类型\",\n            \"severity\": \"critical|high|medium|low\",\n         \
  \   \"message\": \"问题描述\",\n            \"character\": \"涉及的角色名\",\n           \
  \ \"evidence\": \"正文中的证据片段\"\n        }}\n    ],\n    \"suggestions\": [\"改进建议列表\"\
  ]\n}}"
deep_analysis_system_prompt: 你是一位专业的角色行为一致性审核专家。你的任务是检查小说中角色的行为是否符合其设定的性格、动机、能力和关系。任何OOC（Out
  Of Character）行为都应被标记。评分标准：100=完全一致，80=轻微不一致，60=明显不一致，40=严重不一致，20=重大OOC，0=角色完全崩坏。
