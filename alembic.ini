# Auto Novel Writer - Alembic Configuration
# Database migration system for async SQLite (aiosqlite)
#
# Workflow:
#   1. Auto-generate migration after model changes:
#      alembic revision --autogenerate -m "description"
#   2. Apply migrations:
#      alembic upgrade head
#   3. Check current version:
#      alembic current
#   4. View history:
#      alembic history --verbose
#   5. Rollback one revision:
#      alembic downgrade -1
#
# Or use the CLI commands:
#   python cli.py migrate        # Apply all pending migrations
#   python cli.py migrate-auto   # Auto-generate and apply
#   python cli.py migrate-history # Show migration history

[alembic]
script_location = %(here)s/alembic

# Use dated filenames for migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

prepend_sys_path = src/backend

path_separator = os

# Database URL - points to the project's SQLite database
# The actual URL is loaded from config.py in env.py
sqlalchemy.url = sqlite+aiosqlite:///D:/writer/data/writer.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
