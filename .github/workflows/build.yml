name: Build Electron App

on:
  push:
    branches: [master]
    tags:
      - 'v*'
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_prefix: win-
          - os: ubuntu-latest
            artifact_prefix: linux-
          - os: macos-latest
            artifact_prefix: mac-

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'src/frontend/package-lock.json'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install Python dependencies
        run: |
          .venv\Scripts\activate # Windows
          pip install -r src/backend/requirements.txt

      - name: Install frontend dependencies
        run: cd src/frontend && npm ci

      - name: Build frontend
        run: cd src/frontend && npm run build

      - name: Copy frontend build to electron
        run: cp -r src/frontend/dist electron/frontend-build

      - name: Install electron dependencies
        run: cd electron && npm ci

      - name: Build Electron
        if: matrix.os == 'windows-latest'
        run: cd electron && npm run dist:win

      - name: Build Electron (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: cd electron && npm run dist:linux

      - name: Build Electron (macOS)
        if: matrix.os == 'macos-latest'
        run: cd electron && npm run dist:mac

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_prefix }}electron-app
          path: electron/release/**/*
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
