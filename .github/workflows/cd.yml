name: CD - Build & Release

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/writer

jobs:
  # ============================================================
  # Job 1: Version determination
  # ============================================================
  version:
    name: Determine Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_release: ${{ steps.version.outputs.is_release }}
      short_sha: ${{ steps.version.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Calculate version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "version=debug-${{ github.run_id }}" >> $GITHUB_OUTPUT
            echo "is_release=false" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
          else
            COMMIT_MSG=$(git log -1 --format=%s)
            echo "version=dev-$COMMIT_MSG" >> $GITHUB_OUTPUT
            echo "is_release=false" >> $GITHUB_OUTPUT
          fi
          echo "short_sha=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

  # ============================================================
  # Job 2: Build frontend (P0 fix: internalize frontend build)
  # ============================================================
  build-frontend:
    name: Build Frontend
    needs: [version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./src/frontend
        run: npm ci

      - name: Build
        working-directory: ./src/frontend
        run: npm run build

      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: src/frontend/dist
          retention-days: 30

  # ============================================================
  # Job 3: Build Docker images
  # ============================================================
  build-docker:
    name: Build Docker Images
    needs: [version]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            path: src/backend
            dockerfile: src/backend/Dockerfile
            tags_var: BACKEND_TAGS
          - component: frontend
            path: src/frontend
            dockerfile: src/frontend/Dockerfile
            tags_var: FRONTEND_TAGS
    outputs:
      backend_tags: ${{ steps.meta.outputs.BACKEND_TAGS }}
      frontend_tags: ${{ steps.meta.outputs.FRONTEND_TAGS }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: needs.version.outputs.is_release == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        env:
          COMPONENT: ${{ matrix.component }}
          TAGS_VAR: ${{ matrix.tags_var }}
        run: |
          TAGS=""

          # Version tag (for releases)
          if [[ "${{ needs.version.outputs.is_release }}" == "true" ]]; then
            TAGS="${TAGS},${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${COMPONENT}:${{ needs.version.outputs.version }}"
            TAGS="${TAGS},${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${COMPONENT}:latest"
          fi

          # SHA tag (for all builds)
          TAGS="${TAGS},${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${COMPONENT}:${{ needs.version.outputs.short_sha }}"

          # Remove leading comma
          TAGS=${TAGS#,}

          # Set matrix-specific output
          echo "${TAGS_VAR}=$TAGS" >> $GITHUB_OUTPUT
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.path }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ needs.version.outputs.is_release == 'true' }}
          tags: ${{ needs.version.outputs.is_release == 'true' && steps.meta.outputs.tags || 'dummy' }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max

      # Push dev/debug images to GHCR with SHA tag
      - name: Push dev image to GHCR
        if: needs.version.outputs.is_release != 'true'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.path }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.component }}:${{ needs.version.outputs.short_sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max

  # ============================================================
  # Job 4: Build Electron desktop app
  # ============================================================
  build-electron:
    name: Build Electron (${{ matrix.platform }})
    needs: [version, build-frontend]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            artifact_name: Writer-Setup
          - platform: mac
            os: macos-latest
            artifact_name: Writer-mac
          - platform: linux
            os: ubuntu-latest
            artifact_name: Writer-linux
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: electron/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          cd src/backend
          pip install -r requirements.txt

      - name: Get npm dependencies
        working-directory: ./electron
        run: npm ci

      - name: Download frontend artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: ./frontend-build

      - name: Build Electron app
        working-directory: ./electron
        run: |
          npm run build:electron
          npm run dist:${{ matrix.platform }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-${{ matrix.platform }}
          path: electron/release/${{ matrix.platform }}
          retention-days: 30

      - name: Create Release
        if: needs.version.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          files: electron/release/${{ matrix.platform }}/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # Job 5: Generate installer scripts (replaces deploy-server)
  # ============================================================
  generate-installers:
    name: Generate Installers
    needs: [version, build-docker]
    if: needs.version.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate deploy script
        run: |
          cat > deploy.sh << 'SCRIPT'
          #!/bin/bash
          set -e

          VERSION=${1:-latest}
          REGISTRY=${REGISTRY:-ghcr.io}
          IMAGE_PREFIX=${IMAGE_PREFIX:-${{ github.repository_owner }}/writer}
          SHA=${2:-${{ needs.version.outputs.short_sha }}}

          BACKEND_IMAGE="$REGISTRY/$IMAGE_PREFIX-backend:$SHA"
          FRONTEND_IMAGE="$REGISTRY/$IMAGE_PREFIX-frontend:$SHA"

          echo "=========================================="
          echo "  Writer Deploy Script"
          echo "=========================================="
          echo "Version: $VERSION"
          echo "Backend: $BACKEND_IMAGE"
          echo "Frontend: $FRONTEND_IMAGE"
          echo ""

          # Check if Docker is installed
          if ! command -v docker &> /dev/null; then
            echo "Error: Docker is not installed"
            exit 1
          fi

          # Pull images
          echo "Pulling backend image..."
          docker pull $BACKEND_IMAGE

          echo "Pulling frontend image..."
          docker pull $FRONTEND_IMAGE

          # Stop existing containers
          echo "Stopping existing containers..."
          docker stop writer-backend writer-frontend 2>/dev/null || true
          docker rm writer-backend writer-frontend 2>/dev/null || true

          # Run containers
          echo "Starting containers..."
          docker run -d --name writer-backend -p 8000:8000 \
            -e MINIMAX_API_KEY=$MINIMAX_API_KEY \
            $BACKEND_IMAGE

          docker run -d --name writer-frontend -p 3000:80 \
            $FRONTEND_IMAGE

          echo ""
          echo "=========================================="
          echo "  Deployment Complete!"
          echo "=========================================="
          echo "Backend:  http://localhost:8000"
          echo "Frontend: http://localhost:3000"
          SCRIPT
          chmod +x deploy.sh

      - name: Upload deploy script as Release Asset
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          files: deploy.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # Job 6: Build Summary
  # ============================================================
  summary:
    name: Build Summary
    needs: [version, build-docker, build-electron, generate-installers]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          echo "## CI/CD Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${{ needs.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**SHA:** \`${{ needs.version.outputs.short_sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Release:** ${{ needs.version.outputs.is_release }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Docker Images:**" >> $GITHUB_STEP_SUMMARY
          echo "- Backend: \`${{ needs.build-docker.outputs.backend_tags }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend: \`${{ needs.build-docker.outputs.frontend_tags }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Artifacts:**" >> $GITHUB_STEP_SUMMARY
          echo "- frontend-build (30d retention)" >> $GITHUB_STEP_SUMMARY
          echo "- Electron installers (30d retention)" >> $GITHUB_STEP_SUMMARY
          echo "- deploy.sh (Release Asset)" >> $GITHUB_STEP_SUMMARY
